[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nettraffic"
version = "0.1.0"
description = "Network traffic forecasting & anomaly detection for telecom cells"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "holidays>=0.50",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
prophet = ["prophet>=1.1.5"]
dl = ["torch>=2.2"]
mlops = ["mlflow>=2.12"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
all = ["nettraffic[prophet,dl,mlops,dev]"]

[project.scripts]
nettraffic = "nettraffic.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: trains models (seconds to a minute)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
