name: Refresh dashboard

# Daily batch run: retrain, forecast, detect, export site/data, commit to main.
# Cloudflare redeploys automatically on that push.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily (off the top of the hour to avoid queueing)
  workflow_dispatch:
    inputs:
      full:
        description: "Full run: SARIMA/Prophet benchmarks + Optuna tuning (slower, ~15-20 min)"
        type: boolean
        default: false
      seed:
        description: "Synthetic scenario seed (empty = derived from today's date)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[all]"
      - name: Run pipeline
        env:
          FULL: ${{ inputs.full }}
          SEED_INPUT: ${{ inputs.seed }}
        run: |
          SEED="${SEED_INPUT:-$(date -u +%Y%m%d)}"
          ARGS="--seed $SEED --no-mlflow"
          if [ "$FULL" = "true" ]; then ARGS="$ARGS --tune-trials 12"; else ARGS="$ARGS --no-stat-models"; fi
          echo "nettraffic run $ARGS"
          rm -rf site/data
          nettraffic run $ARGS | tee run_summary.txt
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ github.run_id }}
          path: |
            artifacts/*.json
            artifacts/*.csv
          retention-days: 14
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: refresh dashboard $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD:main
